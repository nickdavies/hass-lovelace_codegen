name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.8
      - run: ruff check custom_components/ tests/
      - run: ruff format --check custom_components/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Home Assistant's own test package, versioned with it: this installs
      # Home Assistant 2026.11.2, the version homelab deploys. Move it whenever
      # homelab's does.
      - run: pip install pytest pytest-homeassistant==2026.11.2
      - run: python -m pytest tests/ -v -c tests/pytest.ini
