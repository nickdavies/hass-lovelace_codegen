name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.8
      - run: ruff check custom_components/ tests/
      - run: ruff format --check custom_components/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # This release installs Home Assistant 2026.9.2, the version homelab
      # deploys. Each release pins exactly one Home Assistant version, so move
      # this whenever homelab's does.
      - run: pip install pytest pytest-homeassistant-custom-component==0.13.365
      - run: python -m pytest tests/ -v -c tests/pytest.ini
